[package]
name = "embedrs"
version = "0.6.2"
edition = "2024"
description = "One async client for text embeddings: OpenAI, Cohere, Gemini, Voyage, Jina and Mistral APIs, plus local BERT models on CPU"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goliajp/rust-embeddings"
authors = ["GOLIA株式会社", "Li Hao <lihao@golia.jp>"]
documentation = "https://docs.rs/embedrs"
keywords = ["embeddings", "openai", "bert", "rag", "vector"]
categories = ["api-bindings", "science", "text-processing"]
readme = "README.md"
exclude = ["examples/embedding_models/data.json.zst", "tests/fixtures/"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"
rand = "0.10"
futures = "0.3"
tracing = { version = "0.1", optional = true }
# pricing tables only; no vocabulary is compiled in (tests/cost_tracking.rs checks)
tiktoken = { version = "5.4", optional = true, default-features = false }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
hf-hub = { version = "0.5", optional = true, features = ["tokio"] }

# apple's accelerate framework ships with macos, so the local backend uses it there
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", optional = true, features = ["accelerate"] }
candle-nn = { version = "0.11", optional = true, features = ["accelerate"] }
candle-transformers = { version = "0.11", optional = true, features = ["accelerate"] }

[features]
default = []
tracing = ["dep:tracing"]
cost-tracking = ["dep:tiktoken"]
local = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub"]

[[example]]
name = "benchmark"
required-features = ["local"]

[[example]]
name = "local"
required-features = ["local"]

[[example]]
name = "embedding_models"
path = "examples/embedding_models/main.rs"
required-features = ["local"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
dotenvy = "0.15"
# for examples/embedding_models (uses zstd compression when re-recording) and
# the tokenizer fixtures
zstd = "0.14"
# reference for the wordpiece tests
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
proptest = "1"

[profile.release]
lto = true
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
